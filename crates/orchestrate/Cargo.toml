[package]
name = "orchestrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Datom client for the ordinary Orchestrate Signal."
build = "build.rs"

[[bin]]
name = "orchestrate"
path = "src/main.rs"

[features]
# Generated types derive their textual forms behind `datom`; this client is
# a textualizer, so it is always on.
default = ["datom"]
datom = []

[dependencies]
datom-codec.workspace = true
protos.workspace = true
rkyv.workspace = true
signal = { workspace = true, features = ["datom"] }
signal-orchestrate = { workspace = true, features = ["datom"] }
thiserror.workspace = true

[build-dependencies]
ethos-zero.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
