[package]
name = "orchestrate-nexus"
version = "0.39.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Long-running Orchestrate Nexus and durable Lock state."
build = "build.rs"

[lib]
name = "orchestrate_nexus"

[[bin]]
name = "orchestrate-nexus"
path = "src/main.rs"

[[bin]]
name = "orchestrate-upgrade-preflight"
path = "src/bin/orchestrate_upgrade_preflight.rs"

# Not a client and not a CLI in the Nexus sense: it speaks no signal, opens no
# socket, and reaches no Nexus. It opens the store file, which is the only
# place the question it answers can be settled. See `src/recovery.rs`.
[[bin]]
name = "orchestrate-relocate"
path = "src/bin/orchestrate_relocate.rs"

# No `datom-codec` and no `protos`: the Nexus thinks in typed values and
# never textualizes. The contract crates carry their Datom projection behind
# a feature the clients enable and this crate does not; the `datom-free`
# check witnesses that the built configuration keeps it that way.
[dependencies]
kameo.workspace = true
mio.workspace = true
meta-signal-orchestrate.workspace = true
nexus.workspace = true
rkyv.workspace = true
rustix = { version = "1", features = ["fs"] }
memory-engine.workspace = true
signal.workspace = true
signal-transport.workspace = true
signal-orchestrate.workspace = true
thiserror.workspace = true
tokio.workspace = true

# memory.ethos is generated into src/memory.rs by ethos-zero; the build
# script fails when the committed Rust is stale.
[build-dependencies]
ethos-zero.workspace = true

[dev-dependencies]
tempfile = "3"
memory-engine.workspace = true

[lints]
workspace = true
