[package]
name = "orchestrate-nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Long-running Orchestrate Nexus and durable Lock state."

[lib]
name = "orchestrate_nexus"

[[bin]]
name = "orchestrate-nexus"
path = "src/main.rs"

[[bin]]
name = "orchestrate-upgrade-preflight"
path = "src/bin/orchestrate_upgrade_preflight.rs"

# No `datom-codec` and no `protos`: the Nexus thinks in typed values and
# never textualizes. The contract crates carry their Datom projection behind
# a feature the clients enable and this crate does not; the `datom-free`
# check witnesses that the built configuration keeps it that way.
[dependencies]
meta-signal-orchestrate.workspace = true
nexus.workspace = true
rkyv.workspace = true
sema-engine.workspace = true
signal = { workspace = true, features = ["transport"] }
signal-orchestrate.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
