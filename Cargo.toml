[workspace]
members = [
  "crates/orchestrate-nexus",
  "crates/orchestrate",
  "crates/orchestrate-meta",
]
resolver = "3"

[workspace.package]
version = "0.37.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/orchestrate"
publish = false

[workspace.dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec.git", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb", features = ["rkyv"] }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero.git", rev = "c2653dd82adbdb1f1f2f654405c6620e0d06fd58" }
kameo = { version = "0.22", default-features = false, features = ["macros"] }
meta-signal-orchestrate = { git = "https://github.com/LiGoldragon/meta-signal-orchestrate.git", rev = "77afda05c488e66aa756e3da32344cc33c83b2a3", default-features = false }
nexus = { git = "https://github.com/LiGoldragon/nexus.git", rev = "c495f2acbfff57e017092b9cc1fbf9f73ca2badf" }
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", features = ["rkyv"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "9884905ff9c660ad97a35c524e42532d5c7bac90" }
signal = { git = "https://github.com/LiGoldragon/signal.git", rev = "f35460de930943ea1a8a972453ccf3a092a655b5", default-features = false }
signal-orchestrate = { git = "https://github.com/LiGoldragon/signal-orchestrate.git", rev = "7cc50259f5ebe88d7b63614772d5491d2a34d6ec", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
