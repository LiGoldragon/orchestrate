[workspace]
members = [
  "crates/orchestrate-nexus",
  "crates/orchestrate",
  "crates/orchestrate-meta",
]
resolver = "3"

[workspace.package]
version = "0.31.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/orchestrate"
publish = false

[workspace.dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec.git", rev = "2dad91afce6237d772767bd4ab19f31276e6999e" }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero.git", rev = "daf007296a19ad2f9c8a1e67e102b2e3f09db327" }
meta-signal-orchestrate = { git = "https://github.com/LiGoldragon/meta-signal-orchestrate.git", rev = "7d81bd96b8966988a6cd1fea8ba50888ba92e85a", default-features = false }
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "aac95b0d08a4c7eb7f73c8ea18309f9e2e89315f" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "7158e5503f37fd2fbca1d707f134e38a3fda1176" }
signal-orchestrate = { git = "https://github.com/LiGoldragon/signal-orchestrate.git", rev = "0efc9fdada29e72cad839b2941370afadaf880fb", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
