[workspace]
members = [
  "crates/orchestrate-nexus",
  "crates/orchestrate",
  "crates/orchestrate-meta",
]
resolver = "3"

[workspace.package]
version = "0.33.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/orchestrate"
publish = false

[workspace.dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec.git", rev = "627db67f2655efd9f786864009955005fd8ab2ad" }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero.git", rev = "de3d9928b156f2e1a92d060b7817af201abfdbef" }
meta-signal-orchestrate = { git = "https://github.com/LiGoldragon/meta-signal-orchestrate.git", rev = "4279ad05141c392ad4fee83be7cee09d5dc12df5", default-features = false }
nexus = { git = "https://github.com/LiGoldragon/nexus.git", rev = "a84bfa960c0d5c02d30048c4bbbc67dfef79a67c" }
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "171b21f65337983ab624b7b906397a4f1f92c5a3" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "27e814a721439af67721c530d48b4d2101141f74" }
signal = { git = "https://github.com/LiGoldragon/signal.git", rev = "8f9a0deb701cebbea518679548df4a795affc918", default-features = false }
signal-orchestrate = { git = "https://github.com/LiGoldragon/signal-orchestrate.git", rev = "e7221190ed4cf256ee1f0ead1b8af4758c67079a", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
