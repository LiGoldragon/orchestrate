[package]
name         = "orchestrate"
version      = "0.29.2"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/orchestrate"
description  = "Typed orchestration state for Persona agents."
publish      = false

[lib]
name = "orchestrate"
path = "src/lib.rs"

[[bin]]
name = "orchestrate-nexus"
path = "src/main.rs"

[[bin]]
name = "orchestrate"
path = "src/bin/orchestrate.rs"

[[bin]]
name = "meta-orchestrate"
path = "src/bin/meta_orchestrate.rs"

[[bin]]
name = "orchestrate-upgrade-preflight"
path = "src/bin/orchestrate_upgrade_preflight.rs"

[dependencies]
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "4712361c0194" }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero.git", rev = "0f198968d208" }
meta-signal-orchestrate = { git = "https://github.com/LiGoldragon/meta-signal-orchestrate.git", rev = "3ae11c132272", default-features = false }
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "48061367872b" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "7158e5503f37fd2fbca1d707f134e38a3fda1176" }
signal-orchestrate = { git = "https://github.com/LiGoldragon/signal-orchestrate.git", rev = "f366d6accf8d", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
