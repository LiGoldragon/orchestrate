[workspace]
members = [
  "crates/orchestrate-nexus",
  "crates/orchestrate",
  "crates/orchestrate-meta",
]
resolver = "3"

[workspace.package]
version = "0.39.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/orchestrate"
publish = false

[workspace.dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", features = ["rkyv"] }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "970459d" }
kameo = { version = "0.22", default-features = false, features = ["macros", "tracing"] }
mio = { version = "1", features = ["log"] }
meta-signal-orchestrate = { git = "https://github.com/LiGoldragon/meta-signal-orchestrate", rev = "463ff8b2eddeab63488f12162d32274421ae66cb", default-features = false }
nexus = { git = "https://github.com/LiGoldragon/nexus", rev = "69946db066bb70bdbc1fd7dbf5e6c88dcf05c363" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", features = ["rkyv"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
memory-engine = { git = "https://github.com/LiGoldragon/memory-engine", rev = "32610884907461dc58c6c143f6f9fec0f13695fc" }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "6d4eb74", default-features = false }
signal-transport = { git = "https://github.com/LiGoldragon/signal-transport", rev = "035fb7fbac8de5e493cdb42ed50fefd94bfb569b" }
signal-orchestrate = { git = "https://github.com/LiGoldragon/signal-orchestrate", rev = "2b17beab3a79e937b73bc506f457fa342505de5f", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "tracing"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# Generated types gate their Datom derives behind `datom`. The clients declare
# that feature and open it; the Nexus's generated Memory carries the gate and
# never opens it, because the Nexus never textualizes.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("datom"))'] }
unused = { level = "warn", priority = -1 }
dead_code = "warn"
