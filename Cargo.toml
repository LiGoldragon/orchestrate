[workspace]
members = [
  "crates/orchestrate-nexus",
  "crates/orchestrate",
  "crates/orchestrate-meta",
]
resolver = "3"

[workspace.package]
version = "0.39.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/orchestrate"
publish = false

[workspace.dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec.git", rev = "eabead4", features = ["rkyv"] }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero.git", rev = "970459d" }
kameo = { version = "0.22", default-features = false, features = ["macros"] }
mio = { version = "1", features = ["log"] }
meta-signal-orchestrate = { git = "https://github.com/LiGoldragon/meta-signal-orchestrate.git", rev = "27ac19c", default-features = false }
nexus = { git = "https://github.com/LiGoldragon/nexus.git", rev = "64a735d" }
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "3c7ade3", features = ["rkyv"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
memory-engine = { git = "https://github.com/LiGoldragon/memory-engine.git", rev = "ef24197b22967c6eba0b01080454ba071ccd0a59" }
signal = { git = "https://github.com/LiGoldragon/signal.git", rev = "7afb68b", default-features = false }
signal-orchestrate = { git = "https://github.com/LiGoldragon/signal-orchestrate.git", rev = "e4fda9b", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# Generated types gate their Datom derives behind `datom`. The clients declare
# that feature and open it; the Nexus's generated Memory carries the gate and
# never opens it, because the Nexus never textualizes.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("datom"))'] }
unused = { level = "warn", priority = -1 }
dead_code = "warn"
